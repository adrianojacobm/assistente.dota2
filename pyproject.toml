[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = ["cache", "cache_opendota"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
platform = "win32"
files = ["assistente"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["requests", "pythoncom", "win32com.*"]
ignore_missing_imports = true
